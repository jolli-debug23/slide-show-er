<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Numérico - Jogo de Grupo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #426fa7 0%, #3880c2 50%, #1b558b 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ========== TELA INICIAL ========== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #214184 0%, #426fa7 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeInScreen 0.5s ease;
        }

        .splash-screen.hidden {
            animation: fadeOutScreen 0.5s ease forwards;
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
            animation: slideUp 0.8s ease 0.3s backwards;
        }

        .logo-container {
            margin-bottom: 40px;
            animation: bounce 0.8s ease 0.5s backwards;
        }

        .logo-placeholder {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #608bc1 0%, #3880c2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin: 0 auto;
        }

        .splash-screen h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: -1px;
        }

        .splash-screen p {
            font-size: 1.8rem;
            margin-bottom: 50px;
            opacity: 0.95;
            font-weight: 300;
        }

        .start-btn {
            padding: 18px 60px;
            font-size: 1.8rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #608bc1 0%, #3880c2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
        }

        .start-btn:active {
            transform: translateY(-1px);
        }

        /* ========== TELA DO JOGO ========== */
        .game-screen {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .game-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 40px 30px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.8rem;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.5rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .player-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            background: rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 10px;
            min-width: 150px;
            text-align: center;
        }

        .game-content {
            margin: 30px 0;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        input {
            padding: 18px 25px;
            font-size: 1.6rem;
            border: none;
            border-radius: 15px;
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.95);
            outline: none;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #214184;
        }

        input::placeholder {
            color: #999;
            font-weight: 400;
        }

        input:focus {
            background: white;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            transform: scale(1.02);
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 16px 35px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #608bc1 0%, #3880c2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .guess-btn {
            min-width: 180px;
        }

        .restart-btn {
            display: none;
            background: linear-gradient(135deg, #1b558b 0%, #214184 100%);
        }

        .feedback-box {
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            padding: 25px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            text-align: center;
        }

        .feedback-emoji {
            font-size: 3.5rem;
            margin-bottom: 12px;
            animation: bounce 0.6s ease infinite;
        }

        .feedback-text {
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            line-height: 1.4;
        }

        .cold {
            background: linear-gradient(135deg, rgba(33, 150, 243, 0.3) 0%, rgba(3, 169, 244, 0.3) 100%);
            border-left: 5px solid #2196F3;
        }

        .warm {
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.3) 0%, rgba(255, 87, 34, 0.3) 100%);
            border-left: 5px solid #FF9800;
        }

        .correct {
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.4) 0%, rgba(139, 195, 74, 0.4) 100%);
            border-left: 5px solid #4CAF50;
            animation: pulse-win 0.6s ease;
        }

        .stats {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 25px;
            border-radius: 15px;
            margin: 25px 0;
            font-size: 1.5rem;
            font-weight: 600;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 1.2rem;
            opacity: 0.85;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #608bc1;
        }

        .history-section {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .history-title {
            font-size: 1.6rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .history-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            padding: 12px 15px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.12);
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
            border-left: 3px solid #608bc1;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            background-color: #f00;
            top: 0;
            animation: confetti-fall 4s linear forwards;
            pointer-events: none;
        }

        /* ========== ANIMAÇÕES ========== */
        @keyframes fadeInScreen {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeOutScreen {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse-win {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }

        /* ========== RESPONSIVO ========== */
        @media (max-width: 768px) {
            .splash-screen h1 {
                font-size: 2.5rem;
            }

            .splash-screen p {
                font-size: 1.4rem;
            }

            .start-btn {
                padding: 16px 45px;
                font-size: 1.5rem;
            }

            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2.2rem;
            }

            .header p {
                font-size: 1.3rem;
            }

            .player-info {
                flex-direction: column;
                gap: 15px;
                font-size: 1.3rem;
            }

            input {
                font-size: 1.4rem;
                padding: 16px 20px;
            }

            button {
                font-size: 1.3rem;
                padding: 14px 28px;
            }

            .feedback-emoji {
                font-size: 3rem;
            }

            .feedback-text {
                font-size: 1.6rem;
            }

            .stats {
                font-size: 1.3rem;
            }

            .stat-value {
                font-size: 1.8rem;
            }

            .history-list {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }

            .history-item {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .splash-screen h1 {
                font-size: 2rem;
            }

            .splash-screen p {
                font-size: 1.2rem;
                margin-bottom: 30px;
            }

            .start-btn {
                padding: 14px 35px;
                font-size: 1.3rem;
            }

            .container {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .header p {
                font-size: 1.1rem;
            }

            .input-group {
                flex-direction: column;
            }

            input {
                min-width: auto;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .stats {
                gap: 10px;
            }

            .history-item {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- TELA INICIAL -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="logo-container">
                <div class="logo-placeholder">🎯</div>
            </div>
            <h1>DESAFIO NUMÉRICO</h1>
            <p>Adivinhe o número secreto em grupo!</p>
            <button class="start-btn" id="startBtn">COMEÇAR</button>
        </div>
    </div>

    <!-- TELA DO JOGO -->
    <div class="game-screen" id="gameScreen">
        <div class="container">
            <div class="header">
                <h1>🎯 DESAFIO NUMÉRICO</h1>
                <p>Adivinhe o número entre 0 e 100</p>
            </div>

            <div class="player-info">
                <span>Jogador:</span>
                <div class="player-name" id="playerDisplay">Você</div>
            </div>

            <div class="game-content">
                <div class="input-group">
                    <input 
                        type="number" 
                        id="guessInput" 
                        min="0" 
                        max="100" 
                        placeholder="Digite seu número..."
                        autocomplete="off"
                    >
                    <div class="button-group">
                        <button class="guess-btn" id="guessButton">ADIVINHAR</button>
                    </div>
                </div>

                <div class="feedback-box" id="feedback">
                    <div class="feedback-emoji" id="feedbackEmoji">🤔</div>
                    <div class="feedback-text" id="feedbackText">Faça seu primeiro palpite!</div>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-label">Tentativas</div>
                        <div class="stat-value" id="attemptsCount">0</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">Recorde</div>
                        <div class="stat-value" id="bestAttempts">-</div>
                    </div>
                </div>

                <div class="history-section">
                    <div class="history-title">📋 Histórico de Palpites</div>
                    <ul class="history-list" id="historyList"></ul>
                </div>

                <div class="button-group" style="margin-top: 25px;">
                    <button class="restart-btn" id="restartButton">JOGAR NOVAMENTE</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ========== ELEMENTOS DOM ==========
            const splashScreen = document.getElementById('splashScreen');
            const gameScreen = document.getElementById('gameScreen');
            const startBtn = document.getElementById('startBtn');
            const guessInput = document.getElementById('guessInput');
            const guessButton = document.getElementById('guessButton');
            const feedback = document.getElementById('feedback');
            const feedbackText = document.getElementById('feedbackText');
            const feedbackEmoji = document.getElementById('feedbackEmoji');
            const attemptsCount = document.getElementById('attemptsCount');
            const bestAttempts = document.getElementById('bestAttempts');
            const historyList = document.getElementById('historyList');
            const restartButton = document.getElementById('restartButton');
            const playerDisplay = document.getElementById('playerDisplay');

            // ========== VARIÁVEIS DO JOGO ==========
            let secretNumber;
            let attempts = 0;
            let gameOver = false;
            let bestScore = localStorage.getItem('bestScore') || '-';

            // ========== INICIALIZAÇÃO ==========
            startBtn.addEventListener('click', startGame);
            guessButton.addEventListener('click', makeGuess);
            guessInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') makeGuess();
            });
            restartButton.addEventListener('click', initGame);

            // Mostrar melhor recorde
            bestAttempts.textContent = bestScore;

            // ========== FUNÇÃO: INICIAR JOGO ==========
            function startGame() {
                splashScreen.classList.add('hidden');
                setTimeout(() => {
                    gameScreen.classList.add('visible');
                    initGame();
                }, 300);
            }

            // ========== FUNÇÃO: INICIALIZAR/REINICIAR ==========
            function initGame() {
                secretNumber = Math.floor(Math.random() * 101);
                attempts = 0;
                gameOver = false;

                // Reset interface
                feedback.className = 'feedback-box';
                feedbackText.textContent = 'Faça seu primeiro palpite!';
                feedbackEmoji.textContent = '🤔';
                attemptsCount.textContent = '0';
                historyList.innerHTML = '';
                guessInput.value = '';
                guessInput.disabled = false;
                guessButton.disabled = false;
                restartButton.style.display = 'none';
                guessInput.focus();

                console.log('Número secreto:', secretNumber);
            }

            // ========== FUNÇÃO: PROCESSAR PALPITE ==========
            function makeGuess() {
                if (gameOver) return;

                const guess = parseInt(guessInput.value);

                if (isNaN(guess) || guess < 0 || guess > 100) {
                    feedbackText.textContent = '⚠️ Digite um número entre 0 e 100!';
                    feedbackEmoji.textContent = '❌';
                    feedback.className = 'feedback-box';
                    return;
                }

                attempts++;
                attemptsCount.textContent = attempts;

                // Adicionar ao histórico
                const historyItem = document.createElement('li');
                historyItem.className = 'history-item';
                historyItem.textContent = guess;
                historyList.appendChild(historyItem);

                // Verificar resposta
                if (guess === secretNumber) {
                    endGame(true);
                } else {
                    const difference = Math.abs(guess - secretNumber);
                    const direction = guess < secretNumber ? 'MAIOR' : 'MENOR';

                    if (difference <= 3) {
                        feedbackText.textContent = `🔥 MUUUITO QUENTE! Tente um número ${direction}!`;
                        feedbackEmoji.textContent = '🔴';
                        feedback.className = 'feedback-box warm';
                    } else if (difference <= 10) {
                        feedbackText.textContent = `😅 Quente! Tente um número ${direction}.`;
                        feedbackEmoji.textContent = '🟠';
                        feedback.className = 'feedback-box warm';
                    } else {
                        feedbackText.textContent = `🥶 Frio! Tente um número ${direction}.`;
                        feedbackEmoji.textContent = '🟦';
                        feedback.className = 'feedback-box cold';
                    }
                }

                guessInput.value = '';
                guessInput.focus();
            }

            // ========== FUNÇÃO: ENCERRAR JOGO ==========
            function endGame(won) {
                gameOver = true;

                if (won) {
                    feedbackText.textContent = `🎉 ACERTOU! Foram ${attempts} tentativa${attempts === 1 ? '' : 's'}!`;
                    feedbackEmoji.textContent = '🏆';
                    feedback.className = 'feedback-box correct';

                    // Atualizar melhor recorde
                    if (bestScore === '-' || attempts < parseInt(bestScore)) {
                        bestScore = attempts;
                        localStorage.setItem('bestScore', bestScore);
                        bestAttempts.textContent = bestScore;
                    }

                    createConfetti();
                }

                guessInput.disabled = true;
                guessButton.disabled = true;
                restartButton.style.display = 'inline-block';
            }

            // ========== FUNÇÃO: CRIAR CONFETES ==========
            function createConfetti() {
                const colors = ['#608bc1', '#3880c2', '#426fa7', '#1b558b', '#214184'];

                for (let i = 0; i < 80; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.width = Math.random() * 8 + 4 + 'px';
                    confetti.style.height = Math.random() * 8 + 4 + 'px';
                    confetti.style.animationDuration = Math.random() * 2 + 2.5 + 's';
                    confetti.style.animationDelay = Math.random() * 0.2 + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => confetti.remove(), 5000);
                }
            }
        });
    </script>
</body>
</html>
